[tools]
pnpm = "12.22.0"

[task_config]
dir = "{{config_root}}"

[tasks.lint]
description = "Run Biome lint and format check across workspace (see docs/ARCHITECTURE.md)"
run = "pnpm lint"

[tasks.format]
description = "Format workspace files with Biome"
run = "pnpm format"

[tasks.typecheck]
description = "Run TypeScript typecheck across all workspace packages"
run = "pnpm typecheck"

[tasks.test]
description = "Run Node unit tests across workspace packages (including @gojona/contracts-gen and standards)"
run = "pnpm test"

[tasks.build]
description = "Build workspace package dist/ artifacts and playground application"
run = "pnpm build"

[tasks.check]
description = "Run full verification gate (version check, lint, build, typecheck, test; see docs/ARCHITECTURE.md)"
run = "mise run version:check && pnpm check"

[tasks."version:bump"]
description = "Bump workspace package versions and docs/CHANGELOG.md heading (usage: mise run version:bump -- <X.Y.Z>)"
run = "node scripts/bump-version.mjs"

[tasks."version:check"]
description = "Verify workspace package versions and docs/CHANGELOG.md heading stay aligned"
run = "node scripts/bump-version.mjs --check"
