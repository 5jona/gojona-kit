[tools]
pnpm = "12.22.0"

[task_config]
dir = "{{config_root}}"

[tasks.lint]
description = "Run Biome lint and format check across workspace"
run = "pnpm lint"

[tasks.format]
description = "Format workspace files with Biome"
run = "pnpm format"

[tasks.typecheck]
description = "Run TypeScript typecheck across all workspace packages"
run = "pnpm typecheck"

[tasks.test]
description = "Run Node unit tests across workspace packages"
run = "pnpm test"

[tasks.build]
description = "Build playground application"
run = "pnpm build"

[tasks.check]
description = "Run Biome check, typecheck, unit tests, and playground build"
run = "pnpm check"
