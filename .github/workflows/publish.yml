name: Release & Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Verify, Publish npm & Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full verification gate
        run: pnpm check

      - name: Publish unpublished packages to npmjs.org (OIDC Trusted Publishing / NPM_TOKEN)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "[*] Using NPM_TOKEN secret for npm authentication."
            printf '//registry.npmjs.org/:_authToken=%s\n' "${NPM_TOKEN}" > "${HOME}/.npmrc"
            chmod 0600 "${HOME}/.npmrc"
          else
            echo "[*] Using GitHub Actions OIDC Trusted Publishing (--provenance)."
          fi

          for dir in packages/config packages/contracts-gen packages/bridge packages/ui packages/sdk; do
            pkg_name="$(node -p "require('./${dir}/package.json').name")"
            pkg_ver="$(node -p "require('./${dir}/package.json').version")"
            if npm view "${pkg_name}@${pkg_ver}" version >/dev/null 2>&1; then
              echo "[*] ${pkg_name}@${pkg_ver} already published on npmjs.org — skipping."
            else
              echo "[*] Publishing ${pkg_name}@${pkg_ver}..."
              pnpm --dir "${dir}" publish --access public --provenance --no-git-checks
            fi
          done

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "[*] Release ${TAG} already exists."
          else
            gh release create "${TAG}" \
              --title "gojona-kit ${TAG}" \
              --generate-notes
          fi
