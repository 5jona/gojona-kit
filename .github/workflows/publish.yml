name: Release & Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Verify, Publish npm & Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full verification gate
        run: pnpm check

      - name: Publish unpublished packages to npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "[*] NPM_TOKEN secret not configured — skipping automated npm publish."
            exit 0
          fi
          for dir in packages/config packages/contracts-gen packages/bridge packages/ui packages/sdk; do
            pkg_name="$(node -p "require('./${dir}/package.json').name")"
            pkg_ver="$(node -p "require('./${dir}/package.json').version")"
            if npm view "${pkg_name}@${pkg_ver}" version >/dev/null 2>&1; then
              echo "[*] ${pkg_name}@${pkg_ver} already published on npmjs.org — skipping."
            else
              echo "[*] Publishing ${pkg_name}@${pkg_ver}..."
              pnpm --dir "${dir}" publish --access public --no-git-checks
            fi
          done

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "[*] Release ${TAG} already exists."
          else
            gh release create "${TAG}" \
              --title "pochita-webui-kit ${TAG}" \
              --generate-notes
          fi
